# Priv-Audit: .deb and .rpm, built with nfpm (https://nfpm.goreleaser.com).
#   VERSION=0.1.0 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: priv-audit
arch: all
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: StellerSight Private Limited <security@stellersight.com>
vendor: StellerSight Private Limited
homepage: https://github.com/stellersight/priv-audit
license: Apache-2.0
description: |-
  Read-only Linux privilege-boundary auditor
  Audits sudoers, SUID/SGID binaries, file capabilities, sensitive file
  permissions, cron and OpenSSH settings, and reports an incomplete scan
  as incomplete rather than clean.
depends:
  - python3 (>= 3.8)
recommends:
  - libcap2-bin
overrides:
  rpm:
    depends:
      - python3 >= 3.8
    recommends:
      - libcap
contents:
  - src: privaudit/
    dst: /usr/lib/priv-audit/privaudit/
    type: tree
    file_info: {mode: 0644, owner: root, group: root}
  - src: packaging/priv-audit
    dst: /usr/bin/priv-audit
    file_info: {mode: 0755, owner: root, group: root}
  - src: README.md
    dst: /usr/share/doc/priv-audit/README.md
    file_info: {mode: 0644}
  - src: LICENSE
    dst: /usr/share/doc/priv-audit/LICENSE
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/doc/priv-audit/NOTICE
    file_info: {mode: 0644}
