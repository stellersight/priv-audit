[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stellersight-priv-audit"
version = "0.1.0"
authors = [
    { name = "StellerSight Security Engineering Team", email = "security@stellersight.com" }
]
description = "Zero-dependency Linux privilege boundary and host hardening auditor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
keywords = ["security", "linux", "privilege-escalation", "suid", "sudo", "audit", "compliance", "cis-benchmark"]

[project.scripts]
priv-audit = "privaudit.cli:main"
stellersight-priv-audit = "privaudit.cli:main"

[project.urls]
"Homepage" = "https://github.com/stellersight/priv-audit"
"Bug Tracker" = "https://github.com/stellersight/priv-audit/issues"
"Documentation" = "https://github.com/stellersight/priv-audit#readme"

[tool.setuptools.packages.find]
# Flat layout: only the privaudit package ships; tests and the launcher stay out.
include = ["privaudit*"]
